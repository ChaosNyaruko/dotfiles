# Default colors
[colors.primary]
background = '#EFF1F5' # base
foreground = '#4C4F69' # text
# Bright and dim foreground colors
dim_foreground = '#4C4F69' # text
bright_foreground = '#4C4F69' # text

# Cursor colors
[colors.cursor]
text = '#EFF1F5' # base
cursor = '#DC8A78' # rosewater

[colors.vi_mode_cursor]
text = '#EFF1F5' # base
cursor = '#7287FD' # lavender

# Search colors
[colors.search.matches]
foreground = '#EFF1F5' # base
background = '#6C6F85' # subtext0

[colors.search.focused_match]
foreground = '#EFF1F5' # base
background = '#40A02B' # green

[colors.footer_bar]
foreground = '#EFF1F5' # base
background = '#6C6F85' # subtext0

# Keyboard regex hints
[colors.hints.start]
foreground = '#EFF1F5' # base
background = '#DF8E1D' # yellow

[colors.hints.end]
foreground = '#EFF1F5' # base
background = '#6C6F85' # subtext0

# Selection colors
[colors.selection]
text = '#EFF1F5' # base
background = '#DC8A78' # rosewater

# Normal colors
[colors.normal]
black = '#5C5F77' # subtext1
red = '#D20F39' # red
green = '#40A02B' # green
yellow = '#DF8E1D' # yellow
blue = '#1E66F5' # blue
magenta = '#EA76CB' # pink
cyan = '#179299' # teal
white = '#ACB0BE' # surface2

# Bright colors
[colors.bright]
black = '#6C6F85' # subtext0
red = '#D20F39' # red
green = '#40A02B' # green
yellow = '#DF8E1D' # yellow
blue = '#1E66F5' # blue
magenta = '#EA76CB' # pink
cyan = '#179299' # teal
white = '#BCC0CC' # surface1

# Dim colors
[colors.dim]
black = '#5C5F77' # subtext1
red = '#D20F39' # red
green = '#40A02B' # green
yellow = '#DF8E1D' # yellow
blue = '#1E66F5' # blue
magenta = '#EA76CB' # pink
cyan = '#179299' # teal
white = '#ACB0BE' # surface2


[cursor]
thickness = 0.18
vi_mode_style = "Block"

[env]
TERM = "xterm-256color"

[font]
size = 14.0

[font.bold]
family = "NotoMono Nerd Font"
# family = "Iosevka"
style = "Bold"


[font.italic]
family = "NotoMono Nerd Font"
# family = "Iosevka"
style = "Italic"

[font.normal]
family = "NotoMono Nerd Font"
# family = "Iosevka"
style = "Regular"

[[keyboard.bindings]]
action = "Paste"
key = "V"
mods = "Super"

[[keyboard.bindings]]
action = "Copy"
key = "C"
mods = "Super"

[[keyboard.bindings]]
action = "Quit"
key = "Q"
mods = "Super"

[[keyboard.bindings]]
action = "IncreaseFontSize"
key = "Equals"
mods = "Super"

[[keyboard.bindings]]
action = "DecreaseFontSize"
key = "Minus"
mods = "Super"

[[keyboard.bindings]]
action = "ResetFontSize"
key = "Key0"
mods = "Super"

[[keyboard.bindings]]
action = "ScrollToBottom"
key = "End"
mods = "Shift"

[[keyboard.bindings]]
action = "ScrollToTop"
key = "Home"
mods = "Shift"

[[keyboard.bindings]]
action = "ToggleViMode"
key = "LBracket"
mods = "Control|Alt"

[[keyboard.bindings]]
action = "ToggleViMode"
key = "Q"
mode = "Vi"

[[keyboard.bindings]]
action = "First"
key = "H"
mode = "Vi"
mods = "Shift"

[[keyboard.bindings]]
action = "Last"
key = "L"
mode = "Vi"
mods = "Shift"

[[keyboard.bindings]]
action = "Paste"
key = "P"
mods = "Control|Alt"

[[keyboard.bindings]]
chars = "\u001Bs"
key = "S"
mods = "Alt"

[[keyboard.bindings]]
chars = "\u001Bs"
key = "S"
mods = "Command"

[[keyboard.bindings]]
chars = "\u001B[27;5;97~p"
key = "LBracket"
mods = "Command"

[[keyboard.bindings]]
chars = "\u001B[27;5;97~n"
key = "RBracket"
mods = "Command"

[[keyboard.bindings]]
chars = "\u001E"
key = "Key6"
mods = "Control"

[[keyboard.bindings]]
chars = "\u001B[13;2u"
key = "Return"
mods = "Shift"

[[keyboard.bindings]]
chars = "\u001B[13;5u"
key = "Return"
mods = "Control"

[[keyboard.bindings]]
action = "ToggleFullscreen"
key = "Return"
mods = "Command"

[mouse]
hide_when_typing = false

[selection]
save_to_clipboard = true

[window]
decorations = "Full"
dynamic_padding = true
option_as_alt = "OnlyLeft"

[window.padding]
x = 0
y = 0
