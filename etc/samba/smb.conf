[global]
   workgroup = WORKGROUP
   server string = Samba Server
   security = user
   map to guest = bad user
   log file = /var/log/samba/%m.log
   max log size = 50
[shared]
   path = /srv/samba/shared
   browseable = yes
   writable = yes
   guest ok = no
   valid users = yourusername

